name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    name: E2E Tests
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Print Playwright version
        run: npx playwright --version

      - name: Create test environment file
        run: |
          cat > .env <<'EOF'
          # Keep this blank so CI does not call real ElevenLabs agent infrastructure.
          VITE_ELEVENLABS_AGENT_ID=
          VITE_ELEVENLABS_ENABLED=true
          VITE_ELEVENLABS_SDK_ENABLED=true
          VITE_XAI_ENABLED=true
          VITE_XAI_MODEL=grok-2-public
          VITE_XAI_VOICE=Ara
          VITE_OPENAI_ENABLED=true
          VITE_OPENAI_MODEL=gpt-realtime
          VITE_OPENAI_VOICE=alloy
          VITE_ULTRAVOX_ENABLED=true
          VITE_ULTRAVOX_VOICE=Mark
          VITE_VAPI_ENABLED=true
          VITE_VAPI_WEB_TOKEN=test-public-web-token
          VITE_RETELL_ENABLED=true
          VITE_RETELL_AGENT_ID=test-retell-agent
          VITE_GEMINI_ENABLED=true
          VITE_GEMINI_MODEL=gemini-2.5-flash-native-audio-preview-12-2025
          VITE_GEMINI_VOICE=Zephyr
          VITE_DEFAULT_PROVIDER=elevenlabs
          VITE_API_BASE_URL=http://localhost:3001
          VITE_NODE_ENV=test
          EOF

      - name: Run E2E tests
        run: npm run test:e2e:ci
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload E2E diagnostics
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-diagnostics
          path: |
            *.log
            npm-debug.log*
            ~/.npm/_logs/
          retention-days: 7
          if-no-files-found: ignore
