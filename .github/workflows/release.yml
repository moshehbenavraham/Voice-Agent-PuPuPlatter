name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build
        env:
          CI: true

      - name: Generate release notes
        id: changelog
        run: |
          tag_name="${GITHUB_REF_NAME}"
          prev_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## Release $tag_name" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          if [ -n "$prev_tag" ]; then
            echo "### Changes since $prev_tag" >> RELEASE_NOTES.md
            git log --pretty=format:"- %s (%h)" "$prev_tag"..HEAD >> RELEASE_NOTES.md
          else
            echo "### Initial release notes" >> RELEASE_NOTES.md
            git log --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
          fi

          if [ "$(wc -l < RELEASE_NOTES.md)" -le 3 ]; then
            echo "- No commit subjects found for this tag." >> RELEASE_NOTES.md
          fi

      - name: Package release artifacts
        run: tar -czf voice-agent-dist.tar.gz dist RELEASE_NOTES.md

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: voice-agent-dist
          path: voice-agent-dist.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            voice-agent-dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [release]
    if: ${{ always() && needs.release.result == 'failure' }}
    steps:
      - name: Create failure issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Release workflow failed for ${context.ref}`;
            const body = `The release workflow failed.\n\n` +
              `**Tag:** ${context.ref}\n` +
              `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `Please investigate and retry.`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'ci']
            });
